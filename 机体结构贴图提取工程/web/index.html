<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXVS 机体模型提取与替换</title><style>
:root{color-scheme:dark;--bg:#0b1018;--panel:#141b27;--line:#29374d;--text:#e8eef8;--muted:#9eacc0;--accent:#54baff;--ok:#4bd5a0;--warn:#f0bd61;--bad:#ff6d7c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0a0f17,#111b2b);color:var(--text);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1100px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}h1{font-size:25px;margin:0}p{color:var(--muted);margin:5px 0}.layout{display:grid;grid-template-columns:230px 1fr;gap:16px}.panel{background:#141b27f5;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 18px 50px #0005}nav button{width:100%;display:flex;align-items:center;gap:9px;text-align:left;margin-bottom:8px;padding:12px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer}nav button.active{background:#19334b;border-color:#2b6089;color:#fff}.num{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:#26364a;color:#cce9ff;font-weight:700}h2{font-size:19px;margin:0 0 5px}h3{font-size:15px;margin:18px 0 7px}.lead{margin-bottom:16px}.steps li{margin-bottom:8px}.note{padding:10px 12px;border-left:3px solid var(--warn);background:#302716;border-radius:6px;color:#f1d296}.good{border-color:var(--ok);background:#153027;color:#c9f6e5}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.field{display:flex;flex-direction:column;gap:5px}.wide{grid-column:1/-1}label{font-size:13px;color:#c2ccda}input{padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#090f18;color:var(--text);width:100%}.check{flex-direction:row;align-items:center}.check input{width:auto}.help{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:4px;border:1px solid #6e829d;border-radius:50%;color:#cce5fa;cursor:help;font-size:12px;position:relative}.help span{display:none;position:absolute;z-index:4;left:22px;top:-8px;width:280px;padding:10px;border:1px solid #3b506c;border-radius:8px;background:#0a111c;color:#d8e5f5;box-shadow:0 8px 30px #0009}.help:hover span,.help:focus span{display:block}pre{white-space:pre-wrap;overflow:auto;background:#080c12;border:1px solid var(--line);border-radius:9px;padding:12px;color:#cbd9eb;max-height:330px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button.action{border:0;border-radius:9px;padding:10px 16px;background:var(--accent);color:#06121d;font-weight:700;cursor:pointer}.secondary{background:#2a374b!important;color:#e7eef8!important}.danger{background:#572832!important;color:#ffe0e4!important}.status{font-weight:700}.running{color:var(--accent)}.done{color:var(--ok)}.failed{color:var(--bad)}code{color:#b9dcff}.hidden{display:none}@media(max-width:760px){.layout{grid-template-columns:1fr}.form{grid-template-columns:1fr}.wide{grid-column:auto}.head{flex-direction:column;align-items:start}.help span{left:auto;right:0;top:24px}}
</style></head><body><main>
<div class="head"><div><h1>EXVS 机体模型提取与替换</h1><p>按照 1 → 4 完成 RenderDoc 导出、源文件匹配、Blender 编辑和贴图回包</p></div><div id="status" class="status">空闲</div></div>
<div class="layout"><nav class="panel" id="nav"></nav><section class="panel" id="content"></section></div>
</main><script>
let current=0, config={}, lastCapture='E:\\rendercapture\\my_model_capture';
const pages=[
{name:'RenderDoc 捕获与导出',render:()=>`<h2>第一步：从游戏画面导出机体数据</h2><p class="lead">这一阶段在 <b>qrenderdoc</b> 内完成。需要捕获一帧能看清完整目标机体的游戏画面。</p>
<ol class="steps"><li>启动游戏并让目标机体完整出现在画面中；尽量减少其他机体、UI 特效和遮挡。</li><li>用 RenderDoc 捕获这一帧，保存为 <code>.rdc</code>，再用 qrenderdoc 打开，确认左侧 Event Browser 已出现事件列表。</li><li>在 <b>qrenderdoc 窗口内部</b>打开 <code>Window → Python Shell</code>。</li><li>填写下面的导出目录，复制生成的代码到这个 Python Shell 执行。</li><li>看到 <code>EXVS auto capture complete</code> 表示导出结束。</li></ol>
<div class="note">会导出模型的顶点/索引缓冲、世界矩阵、UV、六类 PBR 贴图、材质参数和 Shader 状态。不要只保存屏幕截图。</div>
<div class="form"><label class="field wide">RenderDoc 数据导出目录<input id="captureOut" value="${lastCapture}"></label></div>
<div class="note"><b>不要粘贴到 Windows PowerShell、CMD 或便携 Python。</b>正确位置是 RenderDoc 图形界面里的 <code>Window → Python Shell</code>，其输入提示符通常为 <code>&gt;&gt;&gt;</code>。</div>
<h3>复制到 qrenderdoc 内置 Python Shell</h3><p>下面始终是一整行 Python 命令。完整复制到 qrenderdoc 的 <code>&gt;&gt;&gt;</code> 后，只按一次回车。</p><pre id="rdcode"></pre><div class="actions"><button class="action" onclick="copyCode('rdcode')">复制整行 Python 代码</button><button class="action secondary" onclick="rememberCapture()">保存目录并进入第二步</button></div>`},
{name:'自动搜索与整理',render:()=>`<h2>第二步：匹配 FHM2D 并生成模型工程</h2><p class="lead">指定第一步的导出目录和游戏 FHM2D 搜索目录。工具会匹配运行时 DDS、恢复零件位置并生成 Blender 导入脚本。</p>
<form id="workform" class="form"><label class="field wide">RenderDoc 导出目录<input id="capture_root" required value="${lastCapture}"></label><label class="field wide">FHM2D 搜索目录<input id="fhm_root" required value="E:\\game\\ob\\25\\data\\x64\\dplcache_release"></label><label class="field wide">已知 FHM2D 文件（不知道则留空）<input id="package"></label><label class="field wide">输出目录（留空时写入 RenderDoc 导出目录）<input id="output"></label>
<label class="field">Draw Group <button type="button" class="help" aria-label="Draw Group 帮助">?<span>自动分析会把同一台机体的 Draw Call 归为一组。第一次请留空，让工具处理全部候选组。若输出中混入其他机体，再查看 model_groups.json 的 group_id，并填写 0 或 0,1,2 分开处理。</span></button><input id="groups" placeholder="第一次请留空"></label><label class="field">并行数<input id="workers" type="number" value="8"></label><label class="field">最低贴图匹配率<input id="min_package_coverage" type="number" step="0.1" value="1.0"></label></form>
<div class="note">Draw Group 是高级筛选项。默认留空；第一次生成结果后，需要拆分不同机体时再填写。</div><div class="actions"><button class="action" onclick="runPipeline('renderdoc')">开始自动匹配与生成</button><button class="action danger" onclick="stopJob()">停止任务</button></div><h3>运行日志</h3><pre id="log">等待任务……</pre>`},
{name:'Blender 导入与编辑',render:()=>`<h2>第三步：在 Blender 4.5 导入自动生成的工程</h2><p class="lead">第二步完成后，每个识别出的机体都会生成独立的 <code>run_in_blender.py</code>。</p>
<ol class="steps"><li>在输出目录中依次进入 <code>model_projects</code> 和目标 <code>model_...</code> 子目录。</li><li>确认其中存在 <code>run_in_blender.py</code>、<code>blender_project.json</code>、<code>parts</code> 和 <code>texture_project</code>。</li><li>打开 Blender 4.5，新建空白文件并切换到 <b>Scripting</b> 工作区。</li><li>填写脚本路径，复制下面的代码到 Blender 的 Python Console 或文本编辑器执行。</li><li>脚本会导入模型零件、恢复位置、建立 PBR 材质、连接贴图并保存工程。</li></ol>
<div class="form"><label class="field wide">生成的 run_in_blender.py 路径<input id="blenderScript" placeholder="...\\model_projects\\model_001_E...\\run_in_blender.py" oninput="updateBlenderCode()"></label></div><h3>复制到 Blender</h3><pre id="blcode">请先填写 run_in_blender.py 路径</pre><div class="actions"><button class="action" onclick="copyCode('blcode')">复制代码</button></div>
<div class="note">建议在空白 Blender 文件中执行。当前恢复静态网格、UV、法线、零件位置和材质，不包含骨骼动画。贴图修改请编辑 texture_project 中的可编辑 PNG。</div>`},
{name:'重新打包贴图',render:()=>`<h2>第四步：将修改后的贴图重新打包</h2><p class="lead">完成 PNG 修改后，把贴图工程重新编码为 FHM2D。建议始终输出到新目录，保留原游戏文件。</p>
<form id="workform" class="form"><label class="field wide">贴图工程或其父目录<input id="folder" required placeholder="包含 project.json 的目录，或 model_projects 目录"></label><label class="field wide">回包输出目录<input id="output" required placeholder="建议使用一个新的输出目录"></label><label class="field check"><input id="force" type="checkbox">强制重新编码全部贴图</label></form>
<div class="note">回包目前支持贴图替换。Blender 中修改后的网格不能重新编码为游戏模型。请先备份，且不要把输出目录直接设为游戏原始目录。</div><div class="actions"><button class="action" onclick="runPipeline('repack')">开始重新打包</button><button class="action danger" onclick="stopJob()">停止任务</button></div><h3>运行日志</h3><pre id="log">等待任务……</pre>`}
];
function drawNav(){nav.innerHTML=pages.map((p,i)=>`<button class="${i===current?'active':''}" onclick="show(${i})"><span class="num">${i+1}</span>${p.name}</button>`).join('')+`<button onclick="closeServer()" style="margin-top:22px">关闭网页服务</button>`}
function show(i){current=i;drawNav();content.innerHTML=pages[i].render();if(i===0)updateRenderDocCode();if(i===2)updateBlenderCode()}
function escPy(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function updateRenderDocCode(){const el=document.getElementById('captureOut');if(!el)return;lastCapture=el.value;const capture=JSON.stringify(lastCapture);const script=JSON.stringify(config.renderdoc_script||'');rdcode.textContent=`EXVS_AUTO_CAPTURE_CONFIG = {"capture_root": ${capture}}; exec(open(${script}, encoding="utf-8").read())`}
function rememberCapture(){lastCapture=document.getElementById('captureOut').value;show(1)}
function updateBlenderCode(){const p=document.getElementById('blenderScript')?.value||'';if(document.getElementById('blcode'))blcode.textContent=p?`exec(open(r'${p}', encoding='utf-8').read())`:'请先填写 run_in_blender.py 路径'}
async function copyCode(id){await navigator.clipboard.writeText(document.getElementById(id).textContent);alert('已复制')}
async function runPipeline(action){const form=document.getElementById('workform');if(!form.reportValidity())return;const data={action};form.querySelectorAll('input').forEach(x=>data[x.id]=x.type==='checkbox'?x.checked:x.value);const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(j.error)alert(j.error)}
function stopJob(){fetch('/api/stop',{method:'POST'})}async function closeServer(){await fetch('/api/shutdown',{method:'POST'});document.body.innerHTML='<main><section class="panel"><h2>网页服务已关闭</h2><p>现在可以关闭此浏览器页面。</p></section></main>'}
async function poll(){try{const s=await(await fetch('/api/status')).json();status.textContent=s.running?'正在运行':s.returncode===null?'空闲':s.returncode===0?'执行完成':'执行失败（代码 '+s.returncode+'）';status.className='status '+(s.running?'running':s.returncode===0?'done':s.returncode===null?'':'failed');const log=document.getElementById('log');if(log){const t=(s.command?'$ '+s.command+'\n\n':'')+(s.lines||[]).join('\n');if(log.textContent!==t){log.textContent=t||'等待任务……';log.scrollTop=log.scrollHeight}}}catch(e){}setTimeout(poll,700)}
document.addEventListener('input',e=>{if(e.target.id==='captureOut')updateRenderDocCode()});fetch('/api/config').then(r=>r.json()).then(j=>{config=j;show(0)});drawNav();show(0);poll();
</script></body></html>
